syntax = "proto3";

package nanommo.settings;

// Each field is optional, so that one the file doesn't have keeps its
// default, where protobuf would give a plain field zero: no sound.
message Sound {
  optional float master = 1;
  optional float music = 2;
  optional bool muted = 3;
  optional float effects = 4;
}

message Graphics {
  optional bool bloom = 1;
  optional bool cel_shading = 2;
  optional bool antialias = 3;
  optional bool day_night = 4;
  optional bool weather = 5;
}

// Whose names show over their heads always, rather than only while they're
// pointed at or picked, and what shows with the names.
message Nameplates {
  optional bool monsters = 1;
  optional bool players = 2;
  optional bool npcs = 3;
  optional bool yours = 4;
  optional bool health = 5;
  optional bool levels = 6;
  optional bool guilds = 7;
}

// How the interface looks and is laid out.
message Interface {
  optional float scale = 1;
  optional bool minimap_turns = 2;
  // The hotbar's skills after the swing, by their ids, in the player's order.
  repeated uint32 hotbar = 3;
  Nameplates nameplates = 4;
  optional bool minimap = 5;
  // The language the interface is in, by its code: none for English.
  optional string language = 6;
}

// What the player sets, which the client keeps between runs.
message Settings {
  Sound sound = 1;
  Graphics graphics = 2;
  Interface ui = 3;
}
