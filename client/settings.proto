syntax = "proto3";

package nanommo.settings;

// Each field is optional, so that one the file doesn't have keeps its
// default, where protobuf would give a plain field zero: no sound.
message Sound {
  optional float master = 1;
  optional float music = 2;
  optional bool muted = 3;
  optional float effects = 4;
}

message Graphics {
  optional bool bloom = 1;
  optional bool cel_shading = 2;
  optional bool antialias = 3;
}

// How the interface looks and is laid out.
message Interface {
  optional float scale = 1;
  optional bool minimap_turns = 2;
  // The hotbar's skills after the swing, by their ids, in the player's order.
  repeated uint32 hotbar = 3;
}

// What the player sets, which the client keeps between runs.
message Settings {
  Sound sound = 1;
  Graphics graphics = 2;
  Interface ui = 3;
}
