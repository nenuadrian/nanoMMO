// A film made in the game: shots of the lands, each with who's in it, what
// they do and when, where the camera goes, and how fast the game's clock runs
// against the film's.
syntax = "proto3";

package nanommo.cinema;

// A place in a land, in metres. `up` is how far above the ground beneath it,
// or above the sea's still surface when `sea` is set, so that the keys of a
// camera flying over hills can be at one height.
message Point {
  float x = 1;
  float z = 2;
  float up = 3;
  bool sea = 4;
}

// Where the camera is, at a moment of the film, and what it looks at. A key
// with no `look` looks where the key before it did.
message Key {
  // In seconds of the film, from the shot's start.
  float at = 1;
  Point eye = 2;
  Point look = 3;
  // The lens, as the angle from the bottom of the picture to its top, in
  // degrees. 0 keeps the key before's (45 at first).
  float fov = 4;
}

// The camera going round a point, looking at it.
message Orbit {
  Point center = 1;
  // In metres, out from the center along the ground, and up from it.
  float radius = 2;
  float up = 3;
  // In degrees round from the north (+z) towards the east (+x), at the shot's
  // start and at its end.
  float from = 4;
  float to = 5;
  float fov = 6;
}

// How fast the game runs from a moment of the film: 1 as fast as the film,
// 0.25 four times slower. It eases from one pace to the next.
message Pace {
  float at = 1;
  float speed = 2;
}

// A skill used, at a moment of the game's clock.
message Cast {
  float at = 1;
  uint32 skill = 2;
  // The monster it's at, by its id here, or 0 for none.
  uint32 target = 3;
}

// A walk or a run to a place, from a moment of the game's clock, at the
// game's own speeds.
message Leg {
  float at = 1;
  Point to = 2;
  bool run = 3;
}

message Player {
  uint32 id = 1;
  string name = 2;
  Point at = 3;
  // In degrees round from the north towards the east.
  float yaw = 4;
  uint32 level = 5;
  uint32 weapon = 6;
  repeated uint32 wearing = 7;
  repeated Cast casts = 8;
  repeated Leg legs = 9;
  // Faces this monster, by id, while standing.
  uint32 face = 10;
}

message Monster {
  uint32 id = 1;
  // By its id in the monsters file.
  uint32 kind = 2;
  Point at = 3;
  // Faces this player, by id, or `yaw` when it's 0.
  uint32 face = 4;
  float yaw = 5;
  uint32 level = 6;
  // When it falls, on the game's clock, whatever hits it, or 0 for when the
  // skills' hits have taken its last.
  float dies = 7;
  repeated Leg legs = 8;
  // The player it runs at, by id, from that moment, to swing at them once
  // it's in reach.
  uint32 charge = 9;
  float charge_at = 10;
  // How many hits it takes to fall: 1 without.
  uint32 hits = 11;
}

// Many monsters of a kind, spread round a place, which act together.
message Pack {
  uint32 kind = 1;
  Point center = 2;
  // In metres.
  float radius = 3;
  uint32 count = 4;
  // Their ids, counting up from this one.
  uint32 first = 5;
  uint32 face = 6;
  uint32 charge = 7;
  float charge_at = 8;
  uint32 hits = 9;
  uint32 level = 10;
}

message Shot {
  string id = 1;
  // By its name: Meadows, Ashlands or Crypt.
  string land = 2;
  // How long, in seconds of the film.
  float seconds = 3;
  // Where the game's clock starts.
  float from = 4;
  repeated Key camera = 5;
  Orbit orbit = 6;
  // Eases the camera in at the start and out at the end, from 0, not at all,
  // to 1.
  float ease = 9;
  repeated Pace pace = 10;
  repeated Player players = 11;
  repeated Monster monsters = 12;
  repeated Pack packs = 14;
}

message Film {
  repeated Shot shots = 1;
}
