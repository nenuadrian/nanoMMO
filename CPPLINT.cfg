# The licence is in LICENSE, at the top of the repo, so the files don't each
# start with a copy of it.
filter=-legal/copyright

# cpplint 2.0.2 reads braces inside a constructor's initializer list, such as
# .Add({}), as the start of a block indented inside the namespace. clang-format
# keeps namespaces unindented already, so we leave that check to it.
filter=-whitespace/indent_namespace
