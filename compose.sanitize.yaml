x-sanitize: &sanitize
  build:
    target: sanitize
    args:
      PRESET: ${PRESET:-asan}

services:
  login:
    <<: *sanitize
    image: nanommo-login-sanitize
    entrypoint: ["build-${PRESET:-asan}/bin/nanommo_login"]

  server:
    <<: *sanitize
    image: nanommo-server-sanitize
    entrypoint: ["build-${PRESET:-asan}/bin/nanommo_server"]

  saver:
    <<: *sanitize
    image: nanommo-saver-sanitize
    entrypoint: ["build-${PRESET:-asan}/bin/nanommo_saver"]

  bots:
    <<: *sanitize
    image: nanommo-bot-sanitize
    entrypoint: ["build-${PRESET:-asan}/bin/nanommo_bot"]

  tests:
    <<: *sanitize
    image: nanommo-tests-sanitize
    command: ["build-${PRESET:-asan}/bin/nanommo_server_tests"]
