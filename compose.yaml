name: nanommo

services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: nanommo
      MYSQL_USER: nanommo
      MYSQL_PASSWORD: nanommo
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      retries: 30

  server:
    build:
      context: .
      target: server
    ports:
      - "7777:7777"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nanommo-server.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  bots:
    build:
      context: .
      target: bot
    command: ["server", "7777", "300", "120"]
    depends_on:
      - server
    profiles:
      - load

volumes:
  mysql:
