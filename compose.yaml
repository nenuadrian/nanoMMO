name: nanommo

services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: nanommo
      MYSQL_USER: nanommo
      MYSQL_PASSWORD: nanommo
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      retries: 30

  flyway:
    image: flyway/flyway:13.10.0
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/nanommo?useSsl=true&trustServerCertificate=true
      FLYWAY_USER: nanommo
      FLYWAY_PASSWORD: nanommo
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./db:/flyway/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:8.8.3
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    environment:
      CLICKHOUSE_DB: nanommo
      CLICKHOUSE_USER: nanommo
      CLICKHOUSE_PASSWORD: nanommo
    volumes:
      - clickhouse:/var/lib/clickhouse
      # Run once, as ClickHouse starts on an empty volume.
      - ./analytics:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "nanommo", "--password", "nanommo", "--query", "SELECT 1"]
      interval: 2s
      retries: 30

  consul:
    image: hashicorp/consul:2.0.4
    command: ["agent", "-dev", "-client=0.0.0.0", "-log-level=warn"]
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 2s
      retries: 30

  certificates:
    build:
      context: .
      target: certificates
    command: ["/tls"]
    volumes:
      - ./tls:/tls

  login:
    build:
      context: .
      target: login
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
      NANOMMO_CONSUL_HOST: consul
      NANOMMO_TLS_CERTIFICATE: /tls/server.crt
      NANOMMO_TLS_KEY: /tls/server.key
    volumes:
      - ./tls:/tls:ro
    ports:
      - "7778:7778"
    depends_on:
      consul:
        condition: service_healthy
      certificates:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  server:
    build:
      context: .
      target: server
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
      NANOMMO_CONSUL_HOST: consul
      NANOMMO_STORYTELLER_HOST: storyteller
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:-localhost}
      NANOMMO_TLS_CERTIFICATE: /tls/server.crt
      NANOMMO_TLS_KEY: /tls/server.key
      NANOMMO_WORLD: Ember
      NANOMMO_WORLD_SEED: 1
    volumes:
      - ./tls:/tls:ro
    ports:
      - "7777:7777"
      - "7777:7777/udp"
      - "9464:9464"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "consul:8500/v1/agent/health/service/id/Ember-7777"]
      interval: 2s
      retries: 30
    stop_grace_period: 15s
    depends_on:
      consul:
        condition: service_healthy
      certificates:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frost:
    extends:
      service: server
    command: ["7787"]
    environment:
      NANOMMO_WORLD: Frost
      NANOMMO_WORLD_SEED: 2
    ports: !override
      - "7787:7787"
      - "7787:7787/udp"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "consul:8500/v1/agent/health/service/id/Frost-7787"]

  server-next:
    extends:
      service: server
    command: ["7877"]
    ports: !override
      - "7877:7877"
      - "7877:7877/udp"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "consul:8500/v1/agent/health/service/id/Ember-7877"]
    networks:
      default:
        aliases:
          - server
    profiles:
      - next

  frost-next:
    extends:
      service: frost
    command: ["7887"]
    ports: !override
      - "7887:7887"
      - "7887:7887/udp"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "consul:8500/v1/agent/health/service/id/Frost-7887"]
    networks:
      default:
        aliases:
          - frost
    profiles:
      - next

  saver:
    build:
      context: .
      target: saver
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  recorder:
    build:
      context: .
      target: recorder
    environment:
      NANOMMO_REDIS_HOST: redis
      NANOMMO_CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: web
    environment:
      APP_NAME: nanoMMO
      APP_KEY: base64:0zEQ9+zkW8PjBBbb4weJGMOYEOOKyUrz7e0YE1W+TDU=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: nanommo
      DB_USERNAME: nanommo
      DB_PASSWORD: nanommo
      REDIS_HOST: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  storyteller:
    build: storyteller
    volumes:
      - huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      retries: 30
      start_period: 5m

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - ./monitoring/loki-rules.yml:/etc/loki/rules/fake/rules.yml:ro
      - loki:/loki
    ports:
      - "3100:3100"

  pyroscope:
    image: grafana/pyroscope:2.4.2
    ports:
      - "4040:4040"

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    # Profiling the servers loads an eBPF program into the kernel, and reads
    # the processes of the other containers.
    privileged: true
    pid: host
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - pyroscope

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nanommo-server.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  bots:
    build:
      context: .
      target: bot
    command: ["login", "server", "${BOTS:-300}", "${RAMP:-120}"]
    environment:
      NANOMMO_TLS_CA: /tls/ca.crt
    volumes:
      - ./tls:/tls:ro
    depends_on:
      - login
      - server
    profiles:
      - load

  netem:
    build:
      context: .
      target: netem
    network_mode: service:server
    cap_add:
      - NET_ADMIN
    profiles:
      - netem

  tests:
    build:
      context: .
      target: build
    command: ["build/bin/nanommo_server_tests"]
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
      NANOMMO_CONSUL_HOST: consul
    depends_on:
      consul:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles:
      - test

  alerts:
    image: prom/prometheus:v3.15.0
    entrypoint: ["promtool"]
    command: ["test", "rules", "/etc/prometheus/alerts_test.yml"]
    volumes:
      - ./monitoring:/etc/prometheus:ro
    profiles:
      - test

  loki-config:
    extends:
      service: loki
    command: ["-config.file=/etc/loki/loki.yaml", "-verify-config"]
    profiles:
      - test

  alloy-config:
    extends:
      service: alloy
    command: ["validate", "/etc/alloy/config.alloy"]
    profiles:
      - test

  coverage:
    build:
      context: .
      target: coverage
    command: ["./coverage.sh"]
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
      NANOMMO_CONSUL_HOST: consul
    volumes:
      - ./site/coverage:/coverage
    depends_on:
      consul:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles:
      - test

volumes:
  mysql:
  redis:
  clickhouse:
  huggingface:
  loki:
