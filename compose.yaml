name: nanommo

services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: nanommo
      MYSQL_USER: nanommo
      MYSQL_PASSWORD: nanommo
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.8.3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  login:
    build:
      context: .
      target: login
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
    ports:
      - "7778:7778"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  server:
    build:
      context: .
      target: server
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
    ports:
      - "7777:7777"
      - "9464:9464"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nanommo-server.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  bots:
    build:
      context: .
      target: bot
    command: ["login", "server", "300", "120"]
    depends_on:
      - login
      - server
    profiles:
      - load

  tests:
    build:
      context: .
      target: build
    command: ["build/bin/nanommo_server_tests"]
    environment:
      NANOMMO_MYSQL_HOST: mysql
      NANOMMO_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test

volumes:
  mysql:
