services:
  mysql:
    environment:
      MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    ports: !reset []
    restart: unless-stopped

  flyway:
    environment:
      FLYWAY_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}

  redis:
    ports: !reset []
    restart: unless-stopped

  consul:
    ports: !override
      - "127.0.0.1:8500:8500"
    restart: unless-stopped

  login:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  server:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:?set it in .env}
    ports: !override
      - "7777:7777"
      - "7777:7777/udp"
    restart: unless-stopped

  frost:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:?set it in .env}
    restart: unless-stopped

  server-next:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:?set it in .env}

  frost-next:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:?set it in .env}

  saver:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  clickhouse:
    ports: !override
      - "127.0.0.1:8123:8123"
    restart: unless-stopped

  web:
    environment:
      APP_KEY: ${NANOMMO_APP_KEY:?set it in .env}
      DB_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  storyteller:
    ports: !reset []
    restart: unless-stopped

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    ports: !override
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  mailpit:
    ports: !override
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  loki:
    ports: !override
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  pyroscope:
    ports: !override
      - "127.0.0.1:4040:4040"
    restart: unless-stopped

  alloy:
    restart: unless-stopped

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
