services:
  mysql:
    environment:
      MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    ports: !reset []
    restart: unless-stopped

  flyway:
    environment:
      FLYWAY_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}

  redis:
    ports: !reset []
    restart: unless-stopped

  consul:
    ports: !override
      - "127.0.0.1:8500:8500"
    restart: unless-stopped

  login:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  server:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
      NANOMMO_PUBLIC_HOST: ${NANOMMO_PUBLIC_HOST:?set it in .env}
    ports: !override
      - "7777:7777"
      - "7777:7777/udp"
    restart: unless-stopped

  saver:
    environment:
      NANOMMO_MYSQL_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  web:
    environment:
      APP_KEY: ${NANOMMO_APP_KEY:?set it in .env}
      DB_PASSWORD: ${NANOMMO_MYSQL_PASSWORD:?set it in .env}
    restart: unless-stopped

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
