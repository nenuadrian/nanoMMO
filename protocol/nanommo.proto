syntax = "proto3";

package nanommo.protocol;

// What a player says to an NPC that talks, by the NPC's id.
message Talk {
  uint32 npc = 1;
  string words = 2;
}

message Input {
  float x = 1;
  float z = 2;
  bool run = 3;
  bool attack = 4;
  string say = 5;
  Talk talk = 6;
}

enum Motion {
  MOTION_IDLE = 0;
  MOTION_WALK = 1;
  MOTION_RUN = 2;
  MOTION_ATTACK = 3;
  MOTION_DEAD = 4;
}

message Player {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  string name = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
}

message Monster {
  uint32 id = 1;
  string name = 2;
  float x = 3;
  float z = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
}

// Someone who stands in one place, and doesn't fight. Each comes once a
// second, with its look: a ball of the colour, as 0xRRGGBBAA, and radius.
message Npc {
  uint32 id = 1;
  string name = 2;
  float x = 3;
  float z = 4;
  float yaw = 5;
  uint32 color = 6;
  float radius = 7;
  bool talks = 8;
}

message Chat {
  string name = 1;
  string text = 2;
}

message World {
  uint32 you = 1;
  repeated Player players = 2;
  int64 sent = 3;
  uint32 part = 4;
  uint32 parts = 5;
  repeated Monster monsters = 6;
  uint32 experience = 7;
  uint32 next_level = 8;
  uint32 seed = 9;
  uint32 land = 10;
  repeated Chat chat = 11;
  repeated Npc npcs = 12;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool new_account = 3;
  bool list_worlds = 4;
}

message WorldListing {
  string name = 1;
  string host = 2;
  uint32 port = 3;
  uint32 players = 4;
}

message LoginReply {
  bool ok = 1;
  string token = 2;
  string error = 3;
  repeated WorldListing worlds = 4;
}

message Hello {
  string token = 1;
}
