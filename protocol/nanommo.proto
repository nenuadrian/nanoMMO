syntax = "proto3";

package nanommo.protocol;

message Input {
  float x = 1;
  float z = 2;
}

message Player {
  uint32 id = 1;
  float x = 2;
  float z = 3;
}

message World {
  uint32 you = 1;
  repeated Player players = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool new_account = 3;
}

message LoginReply {
  bool ok = 1;
  string token = 2;
  string error = 3;
}
