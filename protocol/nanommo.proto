syntax = "proto3";

package nanommo.protocol;

// What a player says to an NPC that talks, by the NPC's id.
message Talk {
  uint32 npc = 1;
  string words = 2;
}

message Input {
  float x = 1;
  float z = 2;
  bool run = 3;
  bool attack = 4;
  string say = 5;
  Talk talk = 6;
  // A skill to use, by its id in the skills file. The client sends it once,
  // as its key goes down.
  uint32 skill = 7;
}

enum Motion {
  MOTION_IDLE = 0;
  MOTION_WALK = 1;
  MOTION_RUN = 2;
  MOTION_ATTACK = 3;
  MOTION_DEAD = 4;
  MOTION_SKILL = 5;
}

message Player {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  string name = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
  // What the player holds, by its id in the items file.
  uint32 weapon = 10;
  // While its motion is a skill's, which skill, by its id in the skills file.
  uint32 skill = 11;
}

message Monster {
  // Its name comes from its kind now. A number we've used stays retired, so
  // that an old client never reads a new field as an old one.
  reserved 2;
  reserved "name";
  uint32 id = 1;
  float x = 3;
  float z = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
  // By its id in the monsters file.
  uint32 kind = 10;
}

// Someone who stands in one place, and doesn't fight. Each comes once a
// second, with its kind, whose name and look are in the NPCs file.
message Npc {
  reserved 2, 6 to 8;
  reserved "name", "color", "radius", "talks";
  uint32 id = 1;
  float x = 3;
  float z = 4;
  float yaw = 5;
  uint32 kind = 9;
}

message Chat {
  string name = 1;
  string text = 2;
}

message World {
  uint32 you = 1;
  repeated Player players = 2;
  int64 sent = 3;
  uint32 part = 4;
  uint32 parts = 5;
  repeated Monster monsters = 6;
  uint32 experience = 7;
  uint32 next_level = 8;
  uint32 seed = 9;
  uint32 land = 10;
  repeated Chat chat = 11;
  repeated Npc npcs = 12;
  // Your skills that aren't ready yet: how long until each one is, in
  // milliseconds, by its id.
  map<uint32, uint32> cooldowns = 13;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool new_account = 3;
  bool list_worlds = 4;
}

message WorldListing {
  string name = 1;
  string host = 2;
  uint32 port = 3;
  uint32 players = 4;
  // The world's ClientHash. Its high bits are as likely set as not, so it
  // takes 8 bytes as a fixed64, where a varint would take up to 10.
  fixed64 content = 5;
}

message LoginReply {
  bool ok = 1;
  string token = 2;
  string error = 3;
  repeated WorldListing worlds = 4;
}

message Hello {
  string token = 1;
}
