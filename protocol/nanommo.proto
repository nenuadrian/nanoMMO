syntax = "proto3";

package nanommo.protocol;

message Input {
  float x = 1;
  float z = 2;
  bool run = 3;
}

enum Motion {
  MOTION_IDLE = 0;
  MOTION_WALK = 1;
  MOTION_RUN = 2;
}

message Player {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  string name = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
}

message Monster {
  uint32 id = 1;
  string name = 2;
  float x = 3;
  float z = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
}

message World {
  uint32 you = 1;
  repeated Player players = 2;
  int64 sent = 3;
  uint32 part = 4;
  uint32 parts = 5;
  repeated Monster monsters = 6;
  uint32 experience = 7;
  uint32 next_level = 8;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool new_account = 3;
}

message LoginReply {
  bool ok = 1;
  string token = 2;
  string error = 3;
}

message Hello {
  string token = 1;
}
