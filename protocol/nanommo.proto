syntax = "proto3";

package nanommo.protocol;

// Items, their slots and their stacks are the items file's.
import "content/items.proto";

// What a player says to an NPC that talks, by the NPC's id.
message Talk {
  uint32 npc = 1;
  string words = 2;
}

// A skill to learn from a trainer, by the NPC's id and the skill's.
message Learn {
  uint32 npc = 1;
  uint32 skill = 2;
}

// A quest an NPC gives, by the NPC's id and the quest's in the quests file.
message Quest {
  uint32 npc = 1;
  uint32 quest = 2;
}

// Where an item is: in a slot of the bag, from zero, or worn.
message Place {
  oneof where {
    uint32 bag = 1;
    items.Slot worn = 2;
  }
}

// Some of what's at one place, to another: how many, or all of them given
// none.
message ItemMove {
  Place from = 1;
  Place to = 2;
  uint32 count = 3;
}

// Something a player does with an item.
message ItemAction {
  oneof action {
    ItemMove move = 1;
    // Use one of what's in this slot of the bag.
    uint32 use = 2;
    // Throw away all of what's there.
    Place destroy = 3;
  }
}

message Input {
  float x = 1;
  float z = 2;
  bool run = 3;
  bool attack = 4;
  string say = 5;
  Talk talk = 6;
  // A skill to use, by its id in the skills file. The client sends it once,
  // as its key goes down.
  uint32 skill = 7;
  Learn learn = 8;
  // Sent once, like a skill.
  ItemAction item = 9;
  // A quest to take, sent once.
  Quest take = 10;
  // A quest to turn in, done, to the NPC who gave it.
  Quest turn_in = 11;
  // Back to life, once the wait is over. Sent once.
  bool respawn = 12;
  // The monster the player picked, by its id, or 0 for none: what their
  // swings and skills go for. It comes with each input, like the keys.
  uint32 target = 13;
  // Somewhere to walk to by itself, around what's in the way. Sent once; the
  // keys, a swing or a skill call the walk off.
  Point walk_to = 14;
  // Something to do about the player's guild. Sent once, like an item's.
  GuildAction guild = 15;
  // Which of the player's inputs this is, from 1: the client sends one each
  // tick, with the keys as they are then, and the server applies them in
  // order, one a tick. 0 for keys the server applies at once, as a bot's.
  uint32 sequence = 16;
  // The newest world the client has whole, every part of it, by when it was
  // sent: the server leaves out of the next ones what hasn't changed since.
  int64 seen = 17;
  // Something to do about a trade with another player. Sent once, like an
  // item's.
  TradeAction trade = 18;
  // Something to do about a duel with another player. Sent once, like a
  // trade's.
  DuelAction duel = 19;
  // The player the player picked, by their id, in place of a monster: their
  // opponent in a duel, or an enemy at war, as nobody else can be. It comes
  // with each input, like the monster.
  uint32 target_player = 20;
  // The moment on the server's clock, in microseconds, that the client drew
  // everyone else at as it sent this, a moment in the past: a blow on another
  // player, in a duel or at war, is checked against where they were then.
  int64 drawn = 21;
  // Something to make, or to stop making. Sent once, like an item's.
  CraftAction craft = 22;
  // A quest to give up, by its id in the quests file, sent once: what was
  // killed for it goes with it, and its giver gives it again.
  uint32 give_up = 23;
}

// A place in a land, in metres from its middle.
message Point {
  float x = 1;
  float z = 2;
}

enum Motion {
  MOTION_IDLE = 0;
  MOTION_WALK = 1;
  MOTION_RUN = 2;
  MOTION_ATTACK = 3;
  MOTION_DEAD = 4;
  MOTION_SKILL = 5;
}

message Player {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  string name = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
  // What the player holds, by its id in the items file.
  uint32 weapon = 10;
  // While its motion is a skill's, which skill, by its id in the skills file.
  uint32 skill = 11;
  // What else the player wears, from the off hand to the feet, by its ids in
  // the items file, so that everyone sees them in it.
  repeated uint32 wearing = 12;
  // While they use a skill, the monster they picked, by its id, so that
  // everyone sees it land there.
  uint32 target = 13;
  // While they use a skill, how many they've started, so that a skill straight
  // after itself, such as a swing held down, starts again on everyone's screen.
  uint32 casts = 14;
  // The name of the guild they're in, which comes with their name.
  string guild = 15;
  // While they use a skill on another player, in a duel or at war, the player
  // they picked, by their id, in place of a monster.
  uint32 target_player = 16;
  // How they chose to look, so that everyone draws them so. A character made
  // before there were looks to choose has none, and their id picks theirs.
  Looks looks = 17;
}

// How a player looks under what they wear, as they chose it, making their
// character: places in the rig's builds and in the figures file's lists of
// skins, hair colours and ways to wear the hair, and in the players' colours,
// for the colour their clothes are dyed in.
message Looks {
  uint32 build = 1;
  uint32 skin = 2;
  uint32 hair_color = 3;
  uint32 hair = 4;
  // A character made before 0.94.1 has none, and their id picks theirs.
  optional uint32 shirt = 5;
}

message Monster {
  // Its name comes from its kind now. A number we've used stays retired, so
  // that an old client never reads a new field as an old one.
  reserved 2;
  reserved "name";
  uint32 id = 1;
  float x = 3;
  float z = 4;
  float yaw = 5;
  Motion motion = 6;
  uint32 level = 7;
  uint32 health = 8;
  uint32 max_health = 9;
  // By its id in the monsters file.
  uint32 kind = 10;
  // How high a blow's thrown it, in metres, while it's in the air.
  float height = 11;
  // While its motion is a skill's, which of its kind's skills, by its id among
  // them, and how long until it lands, in milliseconds, so that everyone sees
  // its shape coming.
  uint32 skill = 12;
  uint32 lands_in = 13;
  // A boss's phase, from one, which its bar at the top of the screen shows.
  uint32 phase = 14;
}

// Someone who stands in one place, and doesn't fight. Each comes once a
// second, with its kind, whose name and look are in the NPCs file.
message Npc {
  reserved 2, 6 to 8;
  reserved "name", "color", "radius", "talks";
  uint32 id = 1;
  float x = 3;
  float z = 4;
  float yaw = 5;
  uint32 kind = 9;
}

// What a player carries and wears. Each change takes it to its next
// revision, so whoever keeps a copy can tell it's changed by the number alone,
// and a player with no revision has never had any.
message Inventory {
  // By slot.
  map<uint32, items.Stack> bag = 1;
  // By items.Slot, which can't be a map's key itself.
  map<uint32, items.Stack> worn = 2;
  uint32 revision = 3;
  // In no slot, and changed with the bag, as a trade gives items and gold
  // together.
  uint32 gold = 4;
}

// The quests a player is on, by their ids, with how many they've killed for
// each, and the ones they've done. Each change takes them to their next
// revision, as a bag's.
message Quests {
  map<uint32, uint32> on = 1;
  uint32 revision = 2;
  repeated uint32 done = 3;
}

// Who hears a line: the whole world, or the guild of the one who said it, or
// everyone in a land, from nobody, as when a world boss falls.
enum Channel {
  CHANNEL_WORLD = 0;
  CHANNEL_GUILD = 1;
  CHANNEL_LAND = 2;
}

message Chat {
  string name = 1;
  string text = 2;
  Channel channel = 3;
}

// Where a player goes when their world's instance hands its players over to
// the next one: the host and port players reach it at, and a token to say
// hello there with.
message Move {
  string host = 1;
  uint32 port = 2;
  string token = 3;
}

enum EventKind {
  EVENT_HIT = 0;
  EVENT_HURT = 1;
  EVENT_HEAL = 2;
  EVENT_LEVEL = 3;
}

// Something that happened in the world, for the players near it to see, such
// as a hit. A unit comes again each tick, and the newest replaces the one
// before it, while each event comes once.
message Event {
  EventKind kind = 1;
  // Who hit, was hit, healed or reached a level, by their id.
  uint32 player = 2;
  // The monster they hit, by its id.
  uint32 monster = 3;
  // The damage, the health given back, or the level reached.
  uint32 amount = 4;
}

message World {
  uint32 you = 1;
  repeated Player players = 2;
  int64 sent = 3;
  uint32 part = 4;
  uint32 parts = 5;
  repeated Monster monsters = 6;
  uint32 experience = 7;
  uint32 next_level = 8;
  uint32 seed = 9;
  uint32 land = 10;
  repeated Chat chat = 11;
  repeated Npc npcs = 12;
  // Your skills that aren't ready yet: how long until each one is, in
  // milliseconds, by its id.
  map<uint32, uint32> cooldowns = 13;
  // The skills you know, by their ids.
  repeated uint32 skills = 14;
  Move move = 15;
  // Your bag, which comes on its own, over TCP, as you join and as it
  // changes.
  Inventory inventory = 16;
  // Your quests, which come the same way.
  Quests quests = 17;
  // What happened near you since the last tick, which comes on its own, over
  // TCP, so that none of it is lost.
  repeated Event events = 18;
  // While you're dead: how long until you can come back, in milliseconds.
  uint32 respawn = 19;
  // Your guild, which comes on its own, over TCP, as you join and as it
  // changes.
  Guild guild = 20;
  // A guild asking you to join, which comes on its own, over TCP.
  GuildInvite invite = 21;
  // The last of your inputs the server has applied, by its sequence.
  uint32 acked = 22;
  // Whether the server moved you itself this tick, along a walk you asked
  // for, up to a monster or with a skill, or you're dead: your keys didn't.
  bool steered = 23;
  // The players and monsters near you that haven't changed since the world
  // your client said it has whole, by their ids alone.
  repeated uint32 still_players = 24;
  repeated uint32 still_monsters = 25;
  // Your trade, which comes on its own, over TCP, as it opens and as it
  // changes, and with nobody in it as it ends.
  Trade trade = 26;
  // Your duel, which comes the same way, as it's asked for, counts down,
  // starts and ends.
  Duel duel = 27;
  // The sky over your land, in every datagram, as it's so small.
  Sky sky = 28;
  // While you're making something, what, and how far it's got, in every
  // datagram, as how long until you can come back is.
  Crafting crafting = 29;
}

// What's falling, or hanging in the air. Each land has its own: rain and
// storms over the Meadows, ash and fire over the Ashlands, mist in the Crypt.
enum Weather {
  WEATHER_CLEAR = 0;
  WEATHER_CLOUDY = 1;
  WEATHER_RAIN = 2;
  WEATHER_STORM = 3;
  WEATHER_MIST = 4;
  WEATHER_ASH = 5;
  WEATHER_FIRE = 6;
}

// The time of day and the weather, which the server works out from the clock,
// so that everyone in a land sees the same sky.
message Sky {
  // How far through the day: 0 is midnight, 0.25 sunrise, 0.5 noon and 0.75
  // sunset.
  float day = 1;
  Weather weather = 2;
  // How much of it, from 0 to 1, which rises as it comes and falls as it goes.
  float strength = 3;
  // Which way the wind blows, and how hard, in metres a second.
  float wind_x = 4;
  float wind_z = 5;
}

// To the login server: log in with a name and password, or make an account,
// and then, with the session the reply gave in their place, make, delete or
// pick a character to enter a world as.
message LoginRequest {
  string username = 1;
  string password = 2;
  bool new_account = 3;
  bool list_worlds = 4;
  string session = 5;
  // A new character in the world, with the name, and the looks.
  bool create_character = 6;
  string world = 7;
  string name = 8;
  Looks looks = 13;
  // The character to delete, or to enter its world as, by its id.
  bool delete_character = 9;
  bool enter = 10;
  uint32 character = 11;
  // The client's version, for the login server to turn away one that doesn't
  // speak its protocol. A client from before versions sends none.
  string version = 12;
}

// One of an account's characters, as the login server knows it, enough to
// list it and draw it.
message CharacterListing {
  uint32 id = 1;
  string name = 2;
  string world = 3;
  uint32 level = 4;
  string land = 5;
  // What's in its main hand, and what else it wears, by their ids in the
  // items file.
  uint32 weapon = 6;
  repeated uint32 wearing = 7;
  // One that's never entered its world, where it gets the starting kit.
  bool fresh = 8;
  // How it looks, unless it's from before there were looks to choose.
  Looks looks = 9;
}

message WorldListing {
  string name = 1;
  string host = 2;
  uint32 port = 3;
  uint32 players = 4;
  // The world's ClientHash. Its high bits are as likely set as not, so it
  // takes 8 bytes as a fixed64, where a varint would take up to 10.
  fixed64 content = 5;
}

message LoginReply {
  bool ok = 1;
  // To enter the world with, once a character's picked.
  string token = 2;
  string error = 3;
  repeated WorldListing worlds = 4;
  // Once logged in: the session to ask with next, and the account's
  // characters in all the worlds.
  string session = 5;
  repeated CharacterListing characters = 6;
}

message Hello {
  string token = 1;
}

// A guild member's rank, from the least. MySQL keeps it as the member's grade.
enum Rank {
  RANK_MEMBER = 0;
  RANK_OFFICER = 1;
  RANK_LEADER = 2;
}

// What a player does about their guild. The server says why not in a line
// from nobody.
message GuildAction {
  oneof action {
    // Found a guild of that name, and lead it.
    string create = 1;
    // Ask a player in this world to join, by their name.
    string invite = 2;
    // Join the guild that asked.
    bool accept = 3;
    // Say no to the guild that asked, so that another can.
    bool decline = 4;
    // A line of chat for the guild alone.
    string say = 5;
    // Leave the guild.
    bool leave = 6;
    // The leader makes a member an officer, or an officer a member again, by
    // their character's id.
    uint32 promote = 7;
    uint32 demote = 8;
    // Take a player of a lower rank out of the guild, by their character's
    // id.
    uint32 kick = 9;
    // The leader ends the guild, for everyone in it.
    bool disband = 10;
    // The leader asks the guild of that name in this world to war, or says
    // yes to it asking first.
    string war = 11;
  }
}

// A guild asking you to join it, which waits a minute for your answer.
message GuildInvite {
  string guild = 1;
  // Who asked, by their name.
  string from = 2;
}

// Your guild, and your rank in it, or no name for none.
message Guild {
  string name = 1;
  Rank rank = 2;
  // Who's in it, the highest rank first, and by name.
  repeated GuildMember members = 3;
  // While it's at war, the war.
  GuildWar war = 4;
}

// Your guild's war with another, as the world last read it from MySQL, a few
// seconds behind the game.
message GuildWar {
  // The other guild, by its name.
  string enemy = 1;
  // How many of their players yours have killed, and of yours they have.
  uint32 kills = 2;
  uint32 enemy_kills = 3;
  // How long it had left, in seconds, until it ends.
  uint32 left = 4;
}

// One of a guild's players, for its roster.
message GuildMember {
  uint32 id = 1;
  string name = 2;
  Rank rank = 3;
  uint32 level = 4;
  // Whether they're playing in the world now.
  bool online = 5;
}

// What one side of a trade offers: the stacks at these places of their bag,
// whole, and gold.
message TradeOffer {
  repeated uint32 bag = 1;
  uint32 gold = 2;
}

// What a player does about a trade. The server says why not in a line from
// nobody.
message TradeAction {
  oneof action {
    // Ask the player of that name, near you in your land, to trade, or say
    // yes to them asking you first.
    string ask = 1;
    // What you offer, in place of what you offered before.
    TradeOffer offer = 2;
    // Whether you'll trade what's offered, both ways. Once both of you will,
    // you trade.
    bool ready = 3;
    // Call the trade off.
    bool cancel = 4;
  }
  // With ready, the revision of the trade it's for, as the server last sent
  // it. A ready for an earlier one does nothing, as it's for offers that have
  // changed since.
  uint32 revision = 5;
}

// One side of a trade: copies of the stacks offered, by their places in the
// bag they came from, the gold, and whether that side is ready.
message TradeSide {
  map<uint32, items.Stack> bag = 1;
  uint32 gold = 2;
  bool ready = 3;
}

// Your trade: who it's with, by their name, or nobody once it's over, and
// what each of you offers.
message Trade {
  string partner = 1;
  TradeSide yours = 2;
  TradeSide theirs = 3;
  // Goes up with each change to either offer, and a ready names it.
  uint32 revision = 4;
}

// What a player does about a duel. The server says why not in a line from
// nobody.
message DuelAction {
  oneof action {
    // Ask the player of that name, near you in your land, to duel.
    string ask = 1;
    // Say yes to the player who asked you, which starts the countdown.
    bool accept = 2;
    // Say no to them.
    bool decline = 3;
    // Give the duel up, to the other side, or call it off before it starts.
    bool yield = 4;
  }
}

// How far a duel has got, from the ask to the fight.
enum DuelState {
  DUEL_NONE = 0;
  // You asked them, and they haven't answered.
  DUEL_ASKING = 1;
  // They asked you.
  DUEL_ASKED = 2;
  // It starts once the countdown's over.
  DUEL_COUNTDOWN = 3;
  // Each of you can hit the other, and nobody else.
  DUEL_FIGHTING = 4;
}

// Your duel: who it's with, by their name and their id, or nobody once it's
// over, and how far it's got.
message Duel {
  string opponent = 1;
  uint32 opponent_id = 2;
  DuelState state = 3;
  // During the countdown, how long until the duel starts, in milliseconds.
  uint32 countdown = 4;
  // From the countdown on, where the one who asked stood as the other said
  // yes, which neither of you may go far from.
  Point flag = 5;
}

// What a player does about crafting. The server says why not in a line from
// nobody.
message CraftAction {
  oneof action {
    // Start making the recipe, by its id in the recipes file.
    uint32 start = 1;
    // Stop making it, which loses nothing.
    bool stop = 2;
  }
}

// What you're making: the recipe, by its id, and how long you've been at it,
// in milliseconds, of its seconds.
message Crafting {
  uint32 recipe = 1;
  uint32 done = 2;
}
