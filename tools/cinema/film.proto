// A film made in the game: shots of the lands, each with who's in it, what
// they do and when, where the camera goes, and how fast the game's clock runs
// against the film's.
syntax = "proto3";

package nanommo.cinema;

// A place in a land, in metres. `up` is how far above the ground beneath it,
// or above the sea's still surface when `sea` is set, so that the keys of a
// camera flying over hills can be at one height.
message Point {
  float x = 1;
  float z = 2;
  float up = 3;
  bool sea = 4;
}

// Where the camera is, at a moment of the film, and what it looks at. A key
// with no `look` looks where the key before it did.
message Key {
  // In seconds of the film, from the shot's start.
  float at = 1;
  Point eye = 2;
  Point look = 3;
  // The lens, as the angle from the bottom of the picture to its top, in
  // degrees. 0 keeps the key before's (45 at first).
  float fov = 4;
}

// The camera going round a point, looking at it.
message Orbit {
  Point center = 1;
  // In metres, out from the center along the ground, and up from it.
  float radius = 2;
  float up = 3;
  // In degrees round from the north (+z) towards the east (+x), at the shot's
  // start and at its end.
  float from = 4;
  float to = 5;
  float fov = 6;
}

// How fast the game runs from a moment of the film: 1 as fast as the film,
// 0.25 four times slower. It eases from one pace to the next.
message Pace {
  float at = 1;
  float speed = 2;
}

// A skill used, at a moment of the game's clock.
message Cast {
  float at = 1;
  uint32 skill = 2;
  // The monster it's at, by its id here, or 0 for none.
  uint32 target = 3;
}

// A walk or a run to a place, from a moment of the game's clock, at the
// game's own speeds.
message Leg {
  float at = 1;
  Point to = 2;
  bool run = 3;
}

message Player {
  uint32 id = 1;
  string name = 2;
  Point at = 3;
  // In degrees round from the north towards the east.
  float yaw = 4;
  uint32 level = 5;
  uint32 weapon = 6;
  repeated uint32 wearing = 7;
  repeated Cast casts = 8;
  repeated Leg legs = 9;
  // Faces this monster, by id, while standing.
  uint32 face = 10;
}

message Monster {
  uint32 id = 1;
  // By its id in the monsters file.
  uint32 kind = 2;
  Point at = 3;
  // Faces this player, by id, or `yaw` when it's 0.
  uint32 face = 4;
  float yaw = 5;
  uint32 level = 6;
  // When it falls, on the game's clock, whatever hits it, or 0 for when the
  // skills' hits have taken its last.
  float dies = 7;
  repeated Leg legs = 8;
  // The player it runs at, by id, from that moment, to swing at them once
  // it's in reach.
  uint32 charge = 9;
  float charge_at = 10;
  // How many hits it takes to fall: 1 without.
  uint32 hits = 11;
}

// Many monsters of a kind, spread round a place, which act together.
message Pack {
  uint32 kind = 1;
  Point center = 2;
  // In metres.
  float radius = 3;
  uint32 count = 4;
  // Their ids, counting up from this one.
  uint32 first = 5;
  uint32 face = 6;
  uint32 charge = 7;
  float charge_at = 8;
  uint32 hits = 9;
  uint32 level = 10;
  // Which way they face, in degrees round from the north towards the east,
  // when they face no one.
  float yaw = 11;
  // When those still standing fall, a little apart, or 0 for when the
  // skills' hits have taken their last.
  float dies = 12;
}

// Which way, as from a point towards the sun.
message Direction {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Changes to the land's sky for this shot.
message Sky {
  float fog_near = 1;
  float fog_far = 2;
  Direction sun = 3;
  // How many of the land's clouds are out, from none to all.
  optional float cloudiness = 4;
  // More of the sun's and the sky's light on everything, or less: 1 as the
  // land has it.
  float light = 5;
  // The time of day the shot starts at, as the server sends it: 0 midnight,
  // 0.25 sunrise, 0.5 noon, 0.75 sunset. Unset, with no weather either, the
  // land has its own look, with the sun where `sun` puts it.
  optional float day = 6;
  // How fast the day goes by, in days a second of the film: 1/60 is a whole
  // day in a minute.
  float days = 7;
  // The weather, by its name without WEATHER_: RAIN, STORM, MIST, ASH, FIRE.
  string weather = 8;
  // How much of it as the shot starts, and as it ends, if it comes or goes
  // in the shot.
  float strength = 9;
  optional float strength_to = 10;
  // How wet the ground is at the start, rather than as wet as the weather
  // makes it: still wet after rain, say.
  optional float wetness = 11;
  // Where the wind blows, in metres a second: unset, a light breeze, or a
  // gale in a storm.
  optional float wind_x = 12;
  optional float wind_z = 13;
}

// The camera behind a player, over their shoulder, looking past them at
// something far off, for a player who stands and watches. It drifts in
// towards them as the shot goes on.
message Shoulder {
  // The player, by their id in the shot, who turns to face what we look at.
  uint32 player = 1;
  // What the camera looks at.
  Point look = 2;
  // In metres: behind them as the shot starts and as it ends, above the
  // ground at their feet, and to their right, or their left if less than 0.
  float back = 3;
  float back_end = 4;
  float up = 5;
  float side = 6;
  // In degrees, top to bottom, and for a tall picture.
  float fov = 7;
  float tall_fov = 8;
}

message Shot {
  string id = 1;
  // By its name: Meadows, Ashlands or Crypt.
  string land = 2;
  // How long, in seconds of the film.
  float seconds = 3;
  // Where the game's clock starts.
  float from = 4;
  repeated Key camera = 5;
  Orbit orbit = 6;
  // The camera for a tall picture, such as a short's, when it needs to be
  // somewhere else to frame the shot: keys, or an orbit.
  repeated Key tall = 7;
  Orbit tall_orbit = 8;
  // Eases the camera in at the start and out at the end, from 0, not at all,
  // to 1.
  float ease = 9;
  repeated Pace pace = 10;
  repeated Player players = 11;
  repeated Monster monsters = 12;
  Sky sky = 13;
  repeated Pack packs = 14;
  Shoulder shoulder = 15;
  // The game's music under the shot: how loud, from 0, none, to 1, as loud
  // as the game plays it at full, and how far into the track it starts, in
  // seconds.
  float music = 16;
  float music_from = 17;
}

message Film {
  repeated Shot shots = 1;
  // Cel shading's bands and outlines, as a player can turn them on in the
  // settings. A film looks as the game does as it starts, without them,
  // unless it says so, as the trailer does.
  bool cel_shading = 2;
}
