syntax = "proto3";

package nanommo.monsters;

// How a kind of monster fights, and how far it goes: the server's part.
message Fight {
  uint32 damage = 1;
  uint32 swing_ms = 2;
  // How far into its swing the blow lands.
  uint32 hit_ms = 3;
  // In metres, like the rest.
  float reach = 4;
  // How close a player comes before it gives chase.
  float sight = 5;
  // It gives up on a player this far from its home.
  float leash = 6;
  // How far from its home it wanders.
  float wander = 7;
}

// How a kind of monster is drawn: the client's part.
message Look {
  // A glTF file in the client's monsters folder.
  string model = 1;
  // In metres.
  float height = 2;
  // As 0xRRGGBBAA. Without one, the model keeps its own colours.
  optional uint32 tint = 3;
}

// What a kind of monster can drop, which goes into its killer's bag: the
// item, by its id in the items file, the chance of it, from nothing to one,
// and how many, from min to max.
message Drop {
  uint32 item = 1;
  float chance = 2;
  // Without them, one.
  uint32 min = 3;
  uint32 max = 4;
}

// How much gold a kind of monster drops each time, from min to max, which
// goes to its killer without a slot of the bag. Without it, none.
message Gold {
  uint32 min = 1;
  uint32 max = 2;
}

// Where a monster's skill lands, around it or in front of it.
enum Shape {
  // All the way round the monster, out to the size.
  CIRCLE = 0;
  // A slice in front of it, as wide as the arc, out to the size.
  CONE = 1;
}

// A big blow a monster telegraphs: the shape it lands on shows on the ground
// first, for long enough to step out of, and it hits whoever's still in it.
message Skill {
  // From one, among its kind's skills.
  uint32 id = 1;
  string name = 2;
  Shape shape = 3;
  // In metres, how far the shape goes out from the monster.
  float size = 4;
  // In degrees, how wide a cone is.
  float arc = 5;
  // How long the shape shows before the skill lands, while the monster stands
  // still.
  uint32 telegraph_ms = 6;
  uint32 damage = 7;
  // How long until it can use it again, from when it starts.
  uint32 cooldown_ms = 8;
  // It starts the skill once the player it's fighting is this near, in
  // metres.
  float range = 9;
  // The shape's colour, as 0xRRGGBBAA.
  uint32 color = 10;
}

// Monsters a boss calls up round it as a phase starts: so many of a kind, by
// its id.
message Add {
  uint32 kind = 1;
  uint32 count = 2;
}

// A stretch of a boss's fight, from a share of its health down, with skills of
// its own.
message Phase {
  // In percent of its most health: it's in this phase from there down to the
  // next phase's. The first is from 100.
  uint32 health = 1;
  // The skills it uses in this phase, by their ids among its kind's, which it
  // tries in its kind's order.
  repeated uint32 skills = 2;
  // They fight for it until it's dead, when they fall with it, or it goes
  // home, when they go too.
  repeated Add adds = 3;
}

message Kind {
  // From one, and a kind keeps its id for good.
  uint32 id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 max_health = 4;
  // What a player gets for killing one.
  uint32 experience = 5;
  Fight fight = 6;
  Look look = 7;
  repeated Drop loot = 8;
  Gold gold = 9;
  // It uses each of them in place of a swing once it's ready, the first first.
  repeated Skill skills = 10;
  // A kind with phases is a boss: as its health goes down, it goes from one
  // phase to the next, and uses the skills each names.
  repeated Phase phases = 11;
}

// A monster that always has its home in the same place, in metres from the
// middle of its land.
message Spawn {
  uint32 kind = 1;
  string land = 2;
  float x = 3;
  float z = 4;
}

// Camps of monsters of a kind, in places that the land's seed picks.
message Camps {
  uint32 kind = 1;
  string land = 2;
  uint32 count = 3;
}

message Monsters {
  repeated Kind kinds = 1;
  repeated Spawn spawns = 2;
  repeated Camps camps = 3;
}
