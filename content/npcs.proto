syntax = "proto3";

package nanommo.npcs;

// How a kind of NPC is drawn: as a person, like the players, in what it
// wears.
message Look {
  reserved 2;
  reserved "radius";
  // As 0xRRGGBBAA: what it wears that's dyed comes in this colour.
  uint32 color = 1;
  // As 0xRRGGBBAA, like the figures file's.
  uint32 skin = 3;
  uint32 hair_color = 4;
  // Which way it wears its hair, by its place in the figures file's hairs,
  // from zero.
  uint32 hair = 5;
  // What it holds in its main hand, and what else it wears, by their ids in
  // the items file.
  uint32 weapon = 6;
  repeated uint32 wearing = 7;
}

message Kind {
  // From one, and a kind keeps its id for good.
  uint32 id = 1;
  string name = 2;
  // Whether players can talk to it. An NPC that talks tells stories.
  bool talks = 3;
  Look look = 4;
  // The skills it teaches, by their ids in the skills file. An NPC that
  // teaches is a trainer.
  repeated uint32 teaches = 5;
}

// Where an NPC stands, in metres from the middle of its land, and which way
// it faces, in radians.
message Spawn {
  uint32 kind = 1;
  string land = 2;
  float x = 3;
  float z = 4;
  float yaw = 5;
}

message Npcs {
  repeated Kind kinds = 1;
  repeated Spawn spawns = 2;
}
