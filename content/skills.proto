syntax = "proto3";

package nanommo.skills;

// One blow of a skill that lands more than once, such as a spin that goes round
// twice.
message Blow {
  // How far into the skill it lands.
  uint32 at_ms = 1;
  // How far it knocks a monster back, in metres.
  float push = 2;
  // How high off the ground it throws the monster, in metres: a launch. One
  // already in the air goes up again, so that blow after blow keeps it there,
  // for two seconds at most. Less than nothing dashes one in the air down, as
  // fast as a fall from that high.
  float lift = 3;
}

// Where a skill has taken the player by a time into it: how far, in metres,
// along the way they faced as it started. The server moves them there, so
// that everyone sees the dash.
message Stride {
  uint32 at_ms = 1;
  float ahead = 2;
  // How they get there from the stride before.
  Ease ease = 3;
}

// What a skill does, and when: the server's part.
message Effect {
  // How long it holds the player, who can't move or swing until it's done.
  uint32 cast_ms = 1;
  // How far into it the skill lands.
  uint32 hit_ms = 2;
  // In metres.
  float reach = 3;
  uint32 damage = 4;
  // Whether it hits each monster in reach, or the nearest.
  bool all = 5;
  // How far it knocks a monster back, in metres.
  float push = 6;
  uint32 heal = 7;
  // A swing of the weapon in the player's hand, with its reach, its damage
  // and its timing, in place of the ones above.
  bool weapon = 8;
  // In degrees, how wide a slice in front of the player it hits, or all the
  // way round, without one.
  float arc = 9;
  // A skill that lands more than once: its blows, in order, in place of hit_ms
  // and push. They share its damage out between them.
  repeated Blow blows = 10;
  // For a swing of the weapon: the share of the weapon's own swing it takes,
  // its timing and its damage, so that a chain of quick swings hurts as much
  // over a second as one slow one. None is the whole swing.
  float pace = 11;
  // Where the skill takes the player, in order. They stay where the last
  // stride leaves them.
  repeated Stride strides = 12;
}

// The joints a move turns, each a bone of the characters.
enum Joint {
  HIPS = 0;
  SPINE = 1;
  CHEST = 2;
  HEAD = 3;
  RIGHT_ARM = 4;
  RIGHT_FOREARM = 5;
  RIGHT_HAND = 6;
  LEFT_ARM = 7;
  LEFT_FOREARM = 8;
  RIGHT_LEG = 9;
  RIGHT_KNEE = 10;
  LEFT_LEG = 11;
  LEFT_KNEE = 12;
}

// A joint's turn, in degrees, about the player's own axes: pitch about the
// one through their shoulders, yaw about up, and roll about the one they face
// along. Each turns the way your fingers curl with your right thumb along its
// axis: the left, up and forward.
message Turn {
  Joint joint = 1;
  float pitch = 2;
  float yaw = 3;
  float roll = 4;
}

// How the joints go from the key before to this one.
enum Ease {
  // Slowly away, and slowly in.
  SMOOTH = 0;
  // Fast away, and slowly in: a strike.
  SNAP = 1;
  // Slowly away, then fast: winding up into it.
  GATHER = 2;
}

// A pose, as turns of the joints from the clip under it, at a time into the
// skill.
message Key {
  uint32 at_ms = 1;
  Ease ease = 2;
  repeated Turn turns = 3;
  // The whole body, up and forward, in metres: a jump, or a lunge.
  float lift = 4;
  float ahead = 5;
}

// The player's move, from key to key, starting from the clip under it.
// A move ends where its last key is, so that key is usually the clip again,
// with no turns.
message Move {
  repeated Key keys = 1;
}

// What a skill shows besides the move: its fx.
message Fx {
  enum Kind {
    // A ribbon of light where the blade has just been.
    TRAIL = 0;
    // A ball of light.
    GLOW = 1;
    // A wave along the ground, spreading out to the size.
    RING = 2;
    // Sparks flying out, and falling.
    SPARKS = 3;
    // Specks of light rising, and swirling.
    MOTES = 4;
    // The camera shakes, by the size in metres.
    SHAKE = 5;
    // Pieces thrown up, which fall back down.
    SHARDS = 6;
    // Spikes out of the ground, in a ring spreading out to the size.
    SPIKES = 7;
    // Lightning, from the sky.
    BOLT = 8;
    // A crescent of light, flying forward to the size.
    WAVE = 9;
    // The blade, lit along its edge.
    EDGE = 10;
    // Cuts that hang in the air, each drawn across in a flash, as long as the
    // size, and fading: as many as the count, each at a slant of its own
    // about the angle.
    SLASH = 11;
    // See-through copies of the player, lit in the colour, where they were a
    // moment ago, each a twentieth of a second behind the one before: as many
    // as the count.
    GHOSTS = 12;
    // The whole view of the player using it, turned towards the colour, and
    // back: only theirs, as a crowd's would never stop.
    FLASH = 13;
    // The camera of the player using it goes in by the size, in metres, and
    // back out.
    ZOOM = 14;
  }
  // Where it is.
  enum Place {
    // At the player's feet.
    PLAYER = 0;
    // At the tip of the player's blade, where it is now.
    BLADE = 1;
    // At the feet of the monster the player picked: without one, it's left
    // out.
    TARGET = 2;
  }
  Kind kind = 1;
  Place at = 2;
  // From the start of the skill, and for how long.
  uint32 from_ms = 3;
  uint32 for_ms = 4;
  // As 0xRRGGBBAA.
  uint32 color = 5;
  // In metres.
  float size = 6;
  // Of sparks, motes, shards, spikes, copies or cuts.
  uint32 count = 7;
  // How far above where it is, in metres: a cut across a monster's chest is
  // a metre up from its feet.
  float up = 8;
  // In degrees, how a cut slants: none is level, and 90 is straight down, as
  // the player sees it.
  float angle = 9;
}

// How a skill looks: the client's part.
message Look {
  // Moves and fx came in place of clips and glows.
  reserved 2, 3;
  reserved "clip", "glow";
  // A Font Awesome icon, by its code point.
  uint32 icon = 1;
  // Without one, the player stands.
  Move move = 4;
  repeated Fx fx = 5;
  // How long each blow that lands holds the player and what it hits still,
  // in milliseconds: the weight of a hit. A blow that pushes or throws holds
  // longer, up to two and a half times as long. They catch up after it, so
  // that the skill ends when the server says.
  uint32 stop_ms = 6;
}

message Skill {
  // From one, and a skill keeps its id for good.
  uint32 id = 1;
  string name = 2;
  // The level a player can learn it from.
  uint32 level = 3;
  // How long until a player can use it again.
  uint32 cooldown_ms = 4;
  Effect effect = 5;
  Look look = 6;
  // A swing that goes on into another: the swing on Space, used again within
  // window_ms of this one's end, is the next, by its id. Holding Space goes
  // through the chain.
  uint32 next = 7;
  uint32 window_ms = 8;
}

message Skills {
  repeated Skill skills = 1;
  // What each new player knows, by id. The others they learn from a trainer.
  repeated uint32 starting = 2;
  // The swing on Space, which every player knows, with the swings it goes on
  // into.
  uint32 attack = 3;
}
