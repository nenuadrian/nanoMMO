apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
      # A sample from Tempo's metrics can name the trace it came from, which
      # a chart shows as a dot that opens it.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
