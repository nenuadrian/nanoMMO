apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # A line from a traced request ends with its trace's id, which opens
      # the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: "trace_id=(\\w+)"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open the trace
