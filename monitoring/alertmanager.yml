global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@nanommo.example
  smtp_require_tls: false

route:
  receiver: email
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: oncall@nanommo.example
        send_resolved: true
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
