global:
  scrape_interval: 2s

scrape_configs:
  - job_name: nanommo-server
    consul_sd_configs:
      - server: consul:8500
        services: [nanommo-world]
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          [__meta_consul_service_address, __meta_consul_service_metadata_metrics_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_consul_service_id]
        target_label: world

  - job_name: nanommo-bots
    dns_sd_configs:
      - names: [bots]
        type: A
        port: 9465
        refresh_interval: 5s
