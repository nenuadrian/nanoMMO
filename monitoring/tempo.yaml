# Tempo, Grafana's trace store, in a single process, with the traces on a
# volume of its own, as Loki keeps the logs.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Alloy sends it the spans, in OpenTelemetry's protocol over gRPC.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Metrics made from the spans as they come, written into Prometheus: who calls
# whom, and how often and how long each kind of span takes.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
