groups:
  - name: nanommo
    rules:
      - alert: WorldFallingBehind
        expr: sum by (world) (rate(nanommo_tick_duration_seconds_count[30s])) < 19
        for: 1m
        annotations:
          summary: '{{ $labels.world }} runs {{ $value | printf "%.1f" }} ticks a second, out of 20'

      - alert: WorldDown
        expr: >-
          max by (world) (max_over_time(up{job="nanommo-server"}[1d]))
          unless on (world) up{job="nanommo-server"} == 1
        for: 1m
        annotations:
          summary: "{{ $labels.world }} is down, or gone from Prometheus's targets"
